<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいアプリ（A-SPICE雛形・実装本体）</title>
<meta name="description" content="単一ファイルの実装本体。SWE.2/3 の persist()/load()/addItem() に対応する最小スターター。">
<style>
  /* ── デザインは family アプリと統一の暖色系。シンプル志向・大きめタップ領域 ── */
  :root{
    --bg:#f4efe6; --card:#fffdf8; --ink:#2a2620; --sub:#6b6357;
    --accent:#1b4332; --line:#e5ddcd;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:28px 20px 48px}
  h1{font-size:1.4rem; margin:0 0 4px}
  .lead{color:var(--sub); margin:0 0 22px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px}
  label{display:block; font-weight:700; margin:0 0 8px}
  input[type=text]{
    width:100%; font-size:1.05rem; padding:12px 14px; min-height:48px;
    border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
  }
  input:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
  .btn{
    margin-top:12px; width:100%; min-height:48px; font-size:1.05rem; font-weight:700;
    color:#fff; background:var(--accent); border:0; border-radius:12px; cursor:pointer;
  }
  .btn:active{opacity:.9}
  ul.items{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:8px}
  ul.items li{
    display:flex; align-items:center; gap:10px; background:#fff;
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  }
  ul.items .del{margin-left:auto; min-height:36px; padding:0 12px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--sub); cursor:pointer}
  .hint{color:var(--sub); font-size:.9rem; margin-top:14px}
  code{background:#efe8da; padding:1px 6px; border-radius:6px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>新しいアプリ（A-SPICE雛形）</h1>
    <p class="lead">この実装本体を書き換えてアプリを作ります。要求→設計→実装のつながりは `02_software/` を参照。</p>

    <div class="card">
      <label for="text">メモを追加（サンプル機能）</label>
      <input id="text" type="text" placeholder="入力して「追加」。端末内に保存されます">
      <button class="btn" id="add" type="button">追加</button>
      <ul class="items" id="list"></ul>
      <p class="hint">
        データはこの端末の中（<code>localStorage</code>）だけに保存され、サーバには送られません（SYR-N2）。
      </p>
    </div>
  </div>

  <script>
    // ── SWA-STORE: localStorage 永続化（SWR-DATA-01） ──
    // キーは「アプリ名:項目」で一意化。複製したら KEY を新アプリ名に変える。
    var KEY = 'template-aspice-webapp:db';

    // SWD-load: 保存済み状態を復元
    function load(){
      try { return JSON.parse(localStorage.getItem(KEY)) || { items: [] }; }
      catch(e){ return { items: [] }; }
    }
    // SWD-persist: 状態を保存（保存漏れを防ぐため書込は必ずここを通す）
    function persist(){ localStorage.setItem(KEY, JSON.stringify(db)); }

    var db = load();

    var input = document.getElementById('text');
    var list  = document.getElementById('list');

    // SWD-render: 一覧を描画
    function render(){
      list.innerHTML = '';
      db.items.forEach(function(item, i){
        var li = document.createElement('li');
        var span = document.createElement('span');
        span.textContent = item;
        var del = document.createElement('button');
        del.className = 'del'; del.type = 'button'; del.textContent = '削除';
        del.addEventListener('click', function(){ removeItem(i); });
        li.appendChild(span); li.appendChild(del);
        list.appendChild(li);
      });
    }

    // SWD-addItem: 追加（SWR-XXX-01）
    function addItem(text){
      var t = (text || '').trim();
      if(!t) return;
      db.items.push(t);
      persist();
      render();
    }
    // SWD-removeItem: 削除
    function removeItem(i){
      db.items.splice(i, 1);
      persist();
      render();
    }

    document.getElementById('add').addEventListener('click', function(){
      addItem(input.value); input.value = ''; input.focus();
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ addItem(input.value); input.value = ''; }
    });

    render();
  </script>
</body>
</html>
